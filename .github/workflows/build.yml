name: Critical CSS

on: push

jobs:
   test:
      name: test
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v3

         - name: Build the docker image
           run: docker compose build

         - name: Run the run.rb script on https://www.ifixit.com
           run: docker run css-gather ./run.rb https://www.ifixit.com > critical.css

         - name: Fail when the critical CSS is empty
           run: test "$(wc -c < critical.css)" -gt 10000
